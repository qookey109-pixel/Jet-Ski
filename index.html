<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Swim Ring Racing V0.11.13</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="game"></div>
  <div id="boot-error" class="boot-error" hidden>3D 引擎沒有載入。請確認網路連線，或雙擊資料夾內的 start.command 啟動。</div>

  <div class="hud">
    <div><strong>SWIM RING RACING</strong> <span id="version">V0.11.13</span></div>
    <div>速度 <span id="speed">0</span> km/h</div>
    <div>海況 <span id="sea-state">一般 Normal</span></div>
    <div>海浪 <span id="wave-state">Hs 0.85 m · Tp 6.2 s</span></div>
    <div>資料 <span id="data-source">Preset</span></div>
    <div>狀態 <span id="air-state">水面 WATER</span></div>
  </div>

  <div class="help">W/↑ 加速｜S/↓ 煞車/倒車｜A/D 轉向｜SPACE Boost｜滑鼠/觸控拖曳 Camera｜Gamepad｜ESC 暫停｜PB Ghost｜Garage｜Challenges｜How to Play｜Settings / Audio</div>

  <div class="physics-controls" aria-label="marine physics controls">
    <button data-hydro-mode="nine-point-plus" class="active">⚓ 9-Point+</button>
    <button data-hydro-mode="nine-point">⚓ Base</button>
    <button data-hydro-mode="voxel">🧊 Voxel EXP</button>
  </div>

  <div class="world-controls" aria-label="world mode controls">
    <button data-world-mode="open-sea" class="active">🌊 外海</button>
    <button data-world-mode="taiwan-coast">🇹🇼 七星潭→外海</button>
    <button data-world-mode="hawaii-coast">🌺 Waikīkī→外海</button>
    <button data-world-mode="sun-moon-lake">🏞️ 日月潭</button>
  </div>

  <div class="sea-controls" aria-label="sea condition controls">
    <button data-sea="calm">1 Calm</button>
    <button data-sea="normal" class="active">2 Normal</button>
    <button data-sea="rough">3 Rough</button>
  </div>

  <div class="mobile-controls" aria-label="mobile controls">
    <div class="steer-group">
      <button id="left" aria-label="左轉">◀</button>
      <button id="right" aria-label="右轉">▶</button>
    </div>
    <div class="throttle-group">
      <button id="brake" aria-label="煞車與倒車">BRAKE / REV</button>
      <button id="gas" class="gas" aria-label="加速">GAS</button>
    </div>
  </div>

  <!-- Classic scripts intentionally used so Safari can run the game directly from file:// -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script>
    if (!window.THREE) document.getElementById('boot-error').hidden = false;
  </script>
  <script src="./src/config.js"></script>
  <script src="./src/real-sea-data.js"></script>
  <script src="./src/ocean.js"></script>
  <script src="./src/hydrodynamics.js"></script>
  <script src="./src/nine-point-plus-hydrodynamics.js"></script>
  <script src="./src/marine-voxel-hydrodynamics.js"></script>
  <script src="./src/marine-hydrodynamics-selector.js"></script>
  <script src="./src/physics-surrogate.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/v06-runtime.js"></script>
  <script src="./src/v07-runtime.js"></script>
  <script src="./src/ocean-visuals.js"></script>
  <script src="./src/v091-virtocean-water.js"></script>
  <script src="./src/fx.js"></script>
  <script src="./src/v092-xorxor-atmosphere.js"></script>
  <script src="./src/v0921-bigger-waves.js"></script>
  <script src="./src/v0922-ocean-focus.js"></script>
  <script src="./src/v0923-giant-waves.js"></script>
  <script src="./src/v0924-giant-surface-sync.js"></script>
  <script src="./src/v093-irregular-infinite-ocean.js"></script>
  <script src="./src/v0982-fast-ocean-sampler.js"></script>
  <script src="./src/v0983-water-contact-forces.js"></script>
  <script src="./src/v0982-marine-smoothing.js"></script>
  <script src="./src/real-world-water.js"></script>
  <script src="./src/reverse-controller.js"></script>
  <script src="./src/v0941-reverse.js"></script>
  <script src="./src/v099-nine-point-plus-runtime.js"></script>
  <script src="./src/v0991-lateral-com-runtime.js"></script>
  <script src="./src/v0992-planar-3dof-runtime.js"></script>
  <script src="./src/v0993-steering-yaw-moment.js"></script>
  <script src="./src/v09931-safari-performance.js"></script>
  <script src="./src/v09932-safari-gpu-budget.js"></script>
  <script src="./src/v094-real-world-water.js"></script>
  <script src="./src/real-world-coast.js"></script>
  <script src="./src/taiwan-coast-runtime.js"></script>
  <script src="./src/hawaii-coast-runtime.js"></script>
  <script src="./src/v097-world-modes.js"></script>
  <script src="./src/v098-marine-physics-lab.js"></script>
  <!-- V0.10 observer stays authority-free. Surge + Sway + Yaw share one identity-cached Planar config. -->
  <script src="./src/v010-unified-6dof-state.js"></script>
  <script src="./src/v0101-calibration-contract.js"></script>
  <script src="./src/v0102-internal-pq-rates.js"></script>
  <script src="./src/v0103-yaw-source-of-truth.js"></script>
  <script src="./src/v01031-yaw-config-cache.js"></script>
  <script src="./src/v0104-surge-source-of-truth.js"></script>
  <script src="./src/v0105-sway-source-of-truth.js"></script>
  <!-- Optional visual-only real-world 3D layer. OSM collision + current ocean/physics remain authoritative. -->
  <script src="./src/v01051-real-world-3d-preview.js"></script>
  <!-- Optional natural-disaster EXP layer. Default sea remains unchanged until an event is triggered. -->
  <script src="./src/v01052-natural-disaster-events.js"></script>
  <!-- Observer-only browser acceptance diagnostics for disaster visual/gameplay sync. -->
  <script src="./src/v010521-disaster-sync-diagnostics.js"></script>
  <!-- Observer-only acceptance capture/receipt helper; does not trigger events or write physics. -->
  <script src="./src/v010522-disaster-acceptance-capture.js"></script>
  <!-- Guided browser acceptance wizard; watches user-triggered events and never writes event/physics authority. -->
  <script src="./src/v010523-guided-disaster-acceptance.js"></script>
  <!-- V0.11 gameplay stack. Progression core is loaded before the selectable race manager. -->
  <script src="./src/game/race-course.js"></script>
  <script src="./src/game/progression-core.js"></script>
  <script src="./src/ui/race-ui.js"></script>
  <script src="./src/game/race-manager.js"></script>
  <!-- Reduced-order AI opponents + live ranking. Player physics remains authoritative and unchanged. -->
  <script src="./src/ai/race-ai-core.js"></script>
  <script src="./src/ai/race-ai-runtime.js"></script>
  <!-- Bounded Nitro surge assist + procedural VFX/audio/camera game feel. -->
  <script src="./src/gameplay/boost-core.js"></script>
  <script src="./src/gameplay/boost-runtime.js"></script>
  <!-- Input/camera polish: full gamepad movement and orbit camera without physics writes. -->
  <script src="./src/input/control-camera-core.js"></script>
  <script src="./src/input/control-camera-runtime.js"></script>
  <!-- Graphics presets + dynamic quality. Safari hard budget remains authoritative. -->
  <script src="./src/rendering/quality-core.js"></script>
  <script src="./src/rendering/quality-runtime.js"></script>
  <!-- V0.11.6 local championship progression + final ending. -->
  <script src="./src/game/progression-runtime.js"></script>
  <!-- V0.11.7 procedural atmosphere/music; no external audio asset or physics authority. -->
  <script src="./src/audio/audio-core.js"></script>
  <script src="./src/audio/audio-runtime.js"></script>
  <!-- V0.11.8 visual-only palette identity + quality-scaled distant procedural dressing. -->
  <script src="./src/rendering/art-direction-core.js"></script>
  <script src="./src/rendering/art-direction-runtime.js"></script>
  <!-- V0.11.9 local PB ghost recorder/replay. Course-relative visual observer; no physics writes. -->
  <script src="./src/game/ghost-core.js"></script>
  <script src="./src/game/ghost-runtime.js"></script>
  <!-- V0.11.10 championship-star Garage rewards; visual livery overlay only. -->
  <script src="./src/game/cosmetics-core.js"></script>
  <script src="./src/game/cosmetics-runtime.js"></script>
  <!-- V0.11.11 persistent replay challenges. Observer/UI only; no physics writes. -->
  <script src="./src/game/challenge-core.js"></script>
  <script src="./src/game/challenge-runtime.js"></script>
  <!-- V0.11.12 first-run onboarding + player status hub. UI/observer only. -->
  <script src="./src/ui/onboarding-core.js"></script>
  <script src="./src/ui/onboarding-runtime.js"></script>
  <!-- V0.11.13 event intro + podium/result presentation. UI/observer only. -->
  <script src="./src/ui/race-presentation-core.js"></script>
  <script src="./src/ui/race-presentation-runtime.js"></script>
</body>
</html>
