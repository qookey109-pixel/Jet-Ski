name: Vendor CC0 Asset Pass 01

on:
  push:
    branches:
      - "feature/asset-discovery-pack-*"
    paths:
      - ".github/workflows/asset-vendor-pass-01.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download Kenney Watercraft Kit through 3d-asset-server
        env:
          JETSKI_ASSET_SERVER_URL: https://3d.shep.bot
        run: |
          rm -rf artifacts/asset-download-preview
          node scripts/asset-download-preview.js
      - name: Extract approved CC0 GLB subset
        run: |
          set -euo pipefail
          out="assets/third-party/kenney-watercraft-kit"
          rm -rf "$out"
          mkdir -p "$out"
          unzip -p artifacts/asset-download-preview/kenney-watercraft-kit.zip "Models/GLB format/boat-speed-f.glb" > "$out/boat-speed-f.glb"
          unzip -p artifacts/asset-download-preview/kenney-watercraft-kit.zip "Models/GLB format/buoy.glb" > "$out/buoy.glb"
          unzip -p artifacts/asset-download-preview/kenney-watercraft-kit.zip "Models/GLB format/buoy-flag.glb" > "$out/buoy-flag.glb"
          unzip -p artifacts/asset-download-preview/kenney-watercraft-kit.zip "Models/GLB format/gate-finish.glb" > "$out/gate-finish.glb"
          unzip -p artifacts/asset-download-preview/kenney-watercraft-kit.zip "License.txt" > "$out/LICENSE-KENNEY.txt"
          sha256sum "$out"/*.glb > "$out/SHA256SUMS.txt"
          cat > "$out/SOURCE.md" <<'EOF'
          # Kenney Watercraft Kit subset

          Source: https://kenney.nl/assets/watercraft-kit
          Discovery/download path: arielshad/3d-asset-server
          Provider asset ID: kenney:watercraft-kit
          Upstream kit version: 2.1
          Upstream creation date: 2024-04-19
          License: Creative Commons Zero (CC0 1.0)
          Commercial use: allowed
          Attribution: not required
          Date reviewed for Jet Ski: 2026-10-07

          Vendored subset:
          - boat-speed-f.glb — visual-only PWC/venue candidate
          - buoy.glb — visual-only venue/race dressing candidate
          - buoy-flag.glb — visual-only venue/race dressing candidate
          - gate-finish.glb — visual-only start/finish dressing candidate

          These assets are presentation-only until explicitly wired into runtime.
          They do not change collision, physics, race rules, checkpoints or AI movement.
          EOF
      - name: Verify payload size and license
        run: |
          test -s assets/third-party/kenney-watercraft-kit/boat-speed-f.glb
          test -s assets/third-party/kenney-watercraft-kit/buoy.glb
          test -s assets/third-party/kenney-watercraft-kit/buoy-flag.glb
          test -s assets/third-party/kenney-watercraft-kit/gate-finish.glb
          grep -q "Creative Commons Zero" assets/third-party/kenney-watercraft-kit/LICENSE-KENNEY.txt
          total=$(du -cb assets/third-party/kenney-watercraft-kit/*.glb | tail -1 | cut -f1)
          echo "Vendored GLB bytes: $total"
          test "$total" -lt 100000
      - name: Commit approved CC0 subset to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/third-party/kenney-watercraft-kit
          if git diff --cached --quiet; then
            echo "No vendor changes"
            exit 0
          fi
          git commit -m "Vendor approved Kenney CC0 watercraft subset"
          git push origin "HEAD:${GITHUB_REF_NAME}"
