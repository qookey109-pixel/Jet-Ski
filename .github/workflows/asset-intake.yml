name: Asset Intake Pass 01

on:
  push:
    branches:
      - "feature/asset-discovery-pack-*"
    paths:
      - ".github/workflows/asset-intake.yml"
      - "scripts/asset-intake-pack.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: |
          node --check scripts/asset-server-cli.js
          node --check scripts/asset-intake-pack.js
      - name: Inspect selected asset metadata
        env:
          JETSKI_ASSET_SERVER_URL: https://3d.shep.bot
        run: node scripts/asset-intake-pack.js
      - name: Upload intake metadata
        uses: actions/upload-artifact@v4
        with:
          name: jet-ski-asset-intake-pass-01
          path: artifacts/asset-intake/
          if-no-files-found: error
          retention-days: 14
