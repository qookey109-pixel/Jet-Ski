name: V0.11 Race Regression

on:
  pull_request:
    paths:
      - 'src/game/**'
      - 'src/ui/race-ui.js'
      - 'tests/v0110-*.test.js'
      - 'index.html'
      - '.github/workflows/v0110-race-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/game/**'
      - 'src/ui/race-ui.js'
      - 'tests/v0110-*.test.js'
      - 'index.html'
      - '.github/workflows/v0110-race-regression.yml'

permissions:
  contents: read

jobs:
  race-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check race runtime
        run: |
          node --check src/game/race-course.js
          node --check src/ui/race-ui.js
          node --check src/game/race-manager.js
      - name: Run race progression regression
        run: node tests/v0110-race-course.test.js
