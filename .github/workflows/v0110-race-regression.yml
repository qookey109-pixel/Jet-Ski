name: V0.11 Race Regression

on:
  pull_request:
    paths:
      - 'src/game/**'
      - 'src/ai/**'
      - 'src/ui/race-ui.js'
      - 'tests/v011*.test.js'
      - 'scripts/**'
      - 'package.json'
      - 'index.html'
      - '.github/workflows/v0110-race-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/game/**'
      - 'src/ai/**'
      - 'src/ui/race-ui.js'
      - 'tests/v011*.test.js'
      - 'scripts/**'
      - 'package.json'
      - 'index.html'
      - '.github/workflows/v0110-race-regression.yml'

permissions:
  contents: read

jobs:
  race-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check race, AI and delivery runtime
        run: |
          node --check src/game/race-course.js
          node --check src/ui/race-ui.js
          node --check src/game/race-manager.js
          node --check src/ai/race-ai-core.js
          node --check src/ai/race-ai-runtime.js
          node --check scripts/static-server.js
          node --check scripts/dev-server.js
          node --check scripts/build.js
          node --check scripts/preview.js
      - name: Run race progression regression
        run: npm run test:race
      - name: Run AI race regression
        run: node tests/v0111-race-ai.test.js
      - name: Verify production build
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/src/game/race-manager.js
          test -f dist/src/ai/race-ai-runtime.js
