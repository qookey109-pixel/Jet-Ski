name: V0.11 Race Regression

on:
  pull_request:
    paths:
      - 'src/game/**'
      - 'src/ai/**'
      - 'src/gameplay/**'
      - 'src/input/**'
      - 'src/rendering/**'
      - 'src/audio/**'
      - 'src/ui/**'
      - 'tests/v011*.test.js'
      - 'scripts/**'
      - 'package.json'
      - 'index.html'
      - '.github/workflows/v0110-race-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/game/**'
      - 'src/ai/**'
      - 'src/gameplay/**'
      - 'src/input/**'
      - 'src/rendering/**'
      - 'src/audio/**'
      - 'src/ui/**'
      - 'tests/v011*.test.js'
      - 'scripts/**'
      - 'package.json'
      - 'index.html'
      - '.github/workflows/v0110-race-regression.yml'

permissions:
  contents: read

jobs:
  race-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check gameplay and delivery runtime
        run: |
          node --check src/game/race-course.js
          node --check src/game/progression-core.js
          node --check src/game/progression-runtime.js
          node --check src/game/ghost-core.js
          node --check src/game/ghost-runtime.js
          node --check src/game/cosmetics-core.js
          node --check src/game/cosmetics-runtime.js
          node --check src/game/challenge-core.js
          node --check src/game/challenge-runtime.js
          node --check src/ui/race-ui.js
          node --check src/ui/onboarding-core.js
          node --check src/ui/onboarding-runtime.js
          node --check src/ui/race-presentation-core.js
          node --check src/ui/race-presentation-runtime.js
          node --check src/ui/mobile-ux-core.js
          node --check src/ui/mobile-ux-runtime.js
          node --check src/ui/save-recovery-core.js
          node --check src/ui/save-recovery-runtime.js
          node --check src/ui/release-marker-runtime.js
          node --check src/game/race-manager.js
          node --check src/ai/race-ai-core.js
          node --check src/ai/race-ai-runtime.js
          node --check src/gameplay/boost-core.js
          node --check src/gameplay/boost-runtime.js
          node --check src/input/control-camera-core.js
          node --check src/input/control-camera-runtime.js
          node --check src/rendering/quality-core.js
          node --check src/rendering/quality-runtime.js
          node --check src/rendering/art-direction-core.js
          node --check src/rendering/art-direction-runtime.js
          node --check src/audio/audio-core.js
          node --check src/audio/audio-runtime.js
          node --check scripts/static-server.js
          node --check scripts/dev-server.js
          node --check scripts/build.js
          node --check scripts/preview.js
          node --check scripts/release-smoke.js
          node --check scripts/browser-release-qa.js
      - name: Run V0.11 gameplay regressions
        run: npm run test:v011
      - name: Verify source release graph
        run: npm run test:release-smoke
      - name: Verify production build
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/src/game/race-manager.js
          test -f dist/src/game/progression-core.js
          test -f dist/src/game/progression-runtime.js
          test -f dist/src/game/ghost-core.js
          test -f dist/src/game/ghost-runtime.js
          test -f dist/src/game/cosmetics-core.js
          test -f dist/src/game/cosmetics-runtime.js
          test -f dist/src/game/challenge-core.js
          test -f dist/src/game/challenge-runtime.js
          test -f dist/src/ui/onboarding-core.js
          test -f dist/src/ui/onboarding-runtime.js
          test -f dist/src/ui/race-presentation-core.js
          test -f dist/src/ui/race-presentation-runtime.js
          test -f dist/src/ui/mobile-ux-core.js
          test -f dist/src/ui/mobile-ux-runtime.js
          test -f dist/src/ui/save-recovery-core.js
          test -f dist/src/ui/save-recovery-runtime.js
          test -f dist/src/ui/release-marker-runtime.js
          test -f dist/src/ai/race-ai-runtime.js
          test -f dist/src/gameplay/boost-runtime.js
          test -f dist/src/input/control-camera-runtime.js
          test -f dist/src/rendering/quality-runtime.js
          test -f dist/src/rendering/art-direction-runtime.js
          test -f dist/src/audio/audio-runtime.js
          node scripts/release-smoke.js dist V0.11.16
      - name: Serve production smoke
        run: |
          node -e "const {startStaticServer}=require('./scripts/static-server'); startStaticServer('dist',4173); setInterval(()=>{},1000)" &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/src/ui/save-recovery-core.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/src/ui/save-recovery-runtime.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/src/ui/release-marker-runtime.js >/dev/null
