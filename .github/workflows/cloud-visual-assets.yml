name: Cloud Visual Assets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/blender/**'
      - '.github/workflows/cloud-visual-assets.yml'

permissions:
  contents: read

jobs:
  build-tropical-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
          blender --background --python-expr "import numpy as np; print('BLENDER_NUMPY_OK', np.__version__)"

      - name: Generate GLB and preview
        env:
          JETSKI_ASSET_OUT: ${{ github.workspace }}/artifacts/cloud-visual-assets
        run: |
          mkdir -p artifacts/cloud-visual-assets
          blender --background --python scripts/blender/generate_tropical_assets.py
          test -s artifacts/cloud-visual-assets/tropical_island_kit.glb
          test -s artifacts/cloud-visual-assets/tropical_island_preview.png

      - name: Show artifact sizes
        run: ls -lh artifacts/cloud-visual-assets/

      - name: Upload generated visual assets
        uses: actions/upload-artifact@v4
        with:
          name: jetski-cloud-visual-assets
          path: artifacts/cloud-visual-assets/
          if-no-files-found: error
          retention-days: 14
